#Server
server.port=8080

#Spring
spring.application.name=hplc-column-management

# \u041F\u0443\u0442\u044C \u043A \u0433\u0440\u0430\u0444\u0438\u0447\u0435\u0441\u043A\u043E\u043C\u0443 \u0438\u043D\u0442\u0435\u0440\u0444\u0435\u0439\u0441\u0443 Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
# \u0421\u043E\u0440\u0442\u0438\u0440\u043E\u0432\u043A\u0430 \u043C\u0435\u0442\u043E\u0434\u043E\u0432 \u0432 \u043A\u043E\u043D\u0442\u0440\u043E\u043B\u043B\u0435\u0440\u0430\u0445 \u043F\u043E \u0430\u043B\u0444\u0430\u0432\u0438\u0442\u0443 (GET, POST, PATCH, DELETE)
springdoc.swagger-ui.operations-sorter=method
# \u041E\u0442\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u0435 \u0432\u0440\u0435\u043C\u0435\u043D\u0438 \u043E\u0442\u0432\u0435\u0442\u0430 \u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432
springdoc.swagger-ui.display-request-duration=true

#Logging
logging.level.root=WARN
logging.level.io.github.deanmave=DEBUG

#JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres