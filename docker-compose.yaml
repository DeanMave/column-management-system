services:
  db:
    image: postgres:16-alpine
    container_name: hplc_postgres
    environment:
      POSTGRES_DB: hplc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hplc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hplc_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hplc_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      JAVA_OPTS: "-Xmx512m"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: